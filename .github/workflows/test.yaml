name: Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'deploy/charts/**'
  pull_request:
    paths-ignore:
      - 'deploy/charts/**'
    branches: [ main ]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11
          args: --output.checkstyle.path=golangci-lint-report.xml
      - name: Upload golangci-lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golangci-lint-report
          path: golangci-lint-report.xml
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        run: make test
      - name: Verify coverage threshold
        run: |
          total=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${total}%"
          if [ "$(echo "$total < 80" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below 80% threshold"
            exit 1
          fi

      # Upload artifacts for downstream Sonar workflow
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: cover.out
          if-no-files-found: error

      - name: Prepare PR context artifact
        if: github.event_name == 'pull_request'
        run: |
          cat > pr-context.json <<'JSON'
          {
            "pr_number": "${{ github.event.pull_request.number }}",
            "head_sha":  "${{ github.event.pull_request.head.sha }}",
            "head_repo": "${{ github.event.pull_request.head.repo.full_name }}",
            "head_branch": "${{ github.event.pull_request.head.ref }}",
            "base_ref": "${{ github.event.pull_request.base.ref }}",
            "run_id": "${{ github.run_id }}"
          }
          JSON

      - name: Upload PR context
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-context
          path: pr-context.json
          retention-days: 1
          if-no-files-found: error

      # Run SonarCloud directly on push to main (has access to secrets)
      - name: SonarCloud Scan (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # BUILD ONCE, LOAD EVERYWHERE. This job is both the "the image still builds" check and the
  # producer of the image the e2e job below runs, so a PR builds the operator image exactly once
  # instead of once here and once inside the e2e run.
  #
  # Parity with `make docker-build`: same Dockerfile, same context, and — like that target — NO
  # --build-arg, so the Dockerfile's own ARG defaults (VERSION=dev, GIT_COMMIT=unknown,
  # BUILD_DATE=unknown) feed the version/commit/date ldflags exactly as they do locally today.
  # The tag is the one the e2e suite deploys by (projectImage in test/e2e/e2e_suite_test.go).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the operator image and export it as an archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          tags: example.com/ilm-operator:v0.0.1
          outputs: type=docker,dest=/tmp/operator-image.tar
          # GitHub Actions layer cache. mode=max is required, not cosmetic: the Dockerfile is a
          # two-stage build whose expensive layers (go mod download, go build) live in the
          # discarded `builder` stage, and the default mode=min would cache only the final
          # distroless image's layers — i.e. cache nothing that costs time. The scope is shared
          # with the E2E Managed workflow's identical build so both populate and hit ONE cache
          # entry; Actions cache reads fall back to the default branch, so a PR's first run
          # reuses the cache main's runs wrote, and later runs of the same branch reuse their own.
          cache-from: type=gha,scope=operator-image
          cache-to: type=gha,mode=max,scope=operator-image
      - name: Upload the operator image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-image
          path: /tmp/operator-image.tar
          retention-days: 1
          if-no-files-found: error

  # FAST e2e tier — runs on every PR/push. `make test-e2e` applies the Ginkgo label filter
  # '!managed', so it exercises the operator deploy + external-mode Platform + Connector lifecycle
  # only (~10min) and never installs the real CloudNativePG/RabbitMQ/Keycloak operators. The
  # expensive managed tier lives in e2e-managed.yaml (gated to a schedule/dispatch/path filter) so
  # a normal PR is never blocked on the ~60min real-upstream run.
  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Download the operator image archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: operator-image
          path: /tmp/operator-image
      # `make test-e2e` creates the Kind cluster itself (its setup-test-e2e prerequisite
      # deletes-then-creates a pristine one), then the suite imports E2E_IMAGE_ARCHIVE into that
      # fresh node and deploys the operator from it. The image load has to happen after the
      # cluster exists, which is why it is passed in rather than run as a preceding make goal.
      - name: Run E2E tests (fast tier)
        run: make -j1 test-e2e E2E_IMAGE_ARCHIVE=/tmp/operator-image/operator-image.tar
      - name: Export logs on failure
        if: failure()
        run: make kind-export-logs
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: /tmp/ilm-operator-e2e-logs/
      - name: Cleanup
        if: always()
        run: make prune-kind-cluster
