# platform_2190.yaml — a Platform with spec.version pinned explicitly to ILM 2.19.0.
#
# 2.19.0 is a RELEASED bundle and the operator's DEFAULT: a version-less CR lands on it at
# creation. This sample pins it anyway, which is the GitOps-recommended form — the manifest
# states the platform version it was reviewed against, so a later operator build that moves the
# default cannot change what this CR installs. Two ways to land on 2.19.0:
#   - FRESH INSTALL. Pin spec.version to "2.19.0" at creation, like this sample (or omit it and
#     take the operator's default, which pins the same version on create).
#   - UPGRADE. Setting spec.version: "2.19.0" on a running platform upgrades it: a managed
#     broker is moved by the operator's own messaging migration engine (fencing/drain/cutover),
#     an external broker requires you to migrate it yourself and acknowledge the move via
#     spec.messaging.migrationAcknowledgedForVersion. See docs/site/upgrading.md for the
#     procedure (Worked example: 2.18.0 to 2.19.0).
#
# WHAT 2.19.0 CHANGES (the operator wires all of it — you configure no env-var names):
#   - images: core and frontend-administrator 2.19.0, auth 1.7.0, scheduler 1.1.1,
#   - the log-level env var is renamed LOGGING_LEVEL_COM_CZERTAINLY → LOGGING_LEVEL_COM_OTILM,
#   - the messaging exchanges are renamed (czertainly → ilm, czertainly-proxy → ilm-proxy), so
#     the per-instance queue Core registers at startup binds under ilm-proxy,
#   - the time-quality integration: spec.messaging.timeQuality.enabled wires Core's
#     MESSAGING_TIME_QUALITY_ENABLED, and spec.core.timeQualityMonitor adds the
#     time-quality-monitor sidecar (a private-repository image — its pull secret must be
#     reachable from spec.image.pullSecrets or the component's own); note that an enabled
#     sidecar both blocks a messaging migration from starting and gates Core's own pod
#     readiness (a failing monitor takes Core out of its Service's endpoints),
#   - spec.core.instanceId wires PLATFORM_INSTANCE_ID for a single-replica Core; a multi-replica
#     Core derives a per-pod id from its StatefulSet ordinal instead (see
#     platform_core_statefulset.yaml).
#
# PREREQUISITES
#   - The ILM operator running in the cluster (make deploy / helm install).
#   - An external PostgreSQL reachable at database.host:port with database.name.
#   - An external AMQP broker reachable at messaging.host:port (+ virtualHost).
#
# SECRETS YOU MUST CREATE FIRST (same namespace as the Platform):
#   # DB credentials — operator reads keys "username" and "password":
#   kubectl create secret generic ilm-db -n ilm \
#     --from-literal=username=ilm --from-literal=password=<db-password>
#   # Messaging credentials — operator reads keys "username" and "password":
#   kubectl create secret generic ilm-messaging -n ilm \
#     --from-literal=username=ilm --from-literal=password=<broker-password>
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  version: "2.19.0"                   # pin the bundle explicitly (recommended for GitOps; this is also the operator's default)
  database:
    mode: external
    host: postgres.example.com
    port: 5432
    name: ilmdb
    credentials:
      secretRef: ilm-db
  messaging:
    mode: external
    brokerType: rabbitmq
    host: rabbitmq.example.com
    port: 5672
    virtualHost: ilm
    credentials:
      secretRef: ilm-messaging
