# platform_edge_byo_secret.yaml — external infra + Ingress edge with a bring-your-own
# (BYO) TLS Secret. NO cert-manager involved.
#
# tls.source=secret tells the operator to use a TLS Secret you provide as the
# Ingress tls secretName; the operator renders no cert-manager objects.
#
# PREREQUISITES
#   - The ILM operator running in the cluster.
#   - External PostgreSQL + AMQP broker (see platform_minimal_external.yaml).
#   - An ingress controller for the chosen class (ingress-nginx for "nginx").
#   - cert-manager is NOT required for source=secret.
#
# SECRETS YOU MUST CREATE FIRST:
#   # DB + messaging creds (keys username/password), as in minimal:
#   kubectl create secret generic ilm-db        -n ilm --from-literal=username=ilm --from-literal=password=<db-password>
#   kubectl create secret generic ilm-messaging -n ilm --from-literal=username=ilm --from-literal=password=<broker-password>
#   # The BYO TLS Secret — a standard kubernetes.io/tls Secret with keys
#   # "tls.crt" (PEM cert chain) and "tls.key" (PEM private key):
#   kubectl create secret tls ilm-ingress-tls -n ilm \
#     --cert=path/to/tls.crt --key=path/to/tls.key
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  database:
    mode: external
    host: postgres.example.com
    port: 5432
    name: ilmdb
    credentials:
      secretRef: ilm-db
  messaging:
    mode: external
    brokerType: rabbitmq
    host: rabbitmq.example.com
    port: 5672
    virtualHost: ilm
    credentials:
      secretRef: ilm-messaging
  edge:
    enabled: true
    type: ingress
    className: nginx
    host: ilm.example.com
    tls:
      source: secret
      secretRef: ilm-ingress-tls    # the kubernetes.io/tls Secret you created above
