# platform_quickstart.yaml — the maintainer's kubectl-apply-and-go demo (everything MANAGED).
#
# The fastest path to a running platform: PostgreSQL, RabbitMQ, and Keycloak are ALL
# operator-managed (CloudNativePG / RabbitMQ Cluster + Messaging Topology / Keycloak
# Operator), and the first admin is bootstrapped from a cert-manager-issued client cert.
# The upstream operators MINT their own credentials; the ILM operator reads them back and
# wires every component. There is NOTHING to pre-create — no Secrets, no external infra.
#
# PREREQUISITES (the upstream operators — that's all):
#   - The ILM operator running in the cluster (make deploy / helm install).
#   - CloudNativePG (for the managed database):
#       kubectl apply --server-side -f \
#         https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.29.1/cnpg-1.29.1.yaml
#   - RabbitMQ Cluster Operator + Messaging Topology Operator (for managed messaging):
#       kubectl apply -f \
#         https://github.com/rabbitmq/cluster-operator/releases/download/v2.21.0/cluster-operator.yml
#       kubectl apply -f \
#         https://github.com/rabbitmq/messaging-topology-operator/releases/download/v1.19.2/messaging-topology-operator-with-certmanager.yaml
#   - Keycloak Operator (for managed Keycloak — serves the k8s.keycloak.org CRDs):
#       kubectl apply -f \
#         https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/main/kubernetes/keycloaks.k8s.keycloak.org-v1.yml
#       kubectl apply -f \
#         https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/main/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
#       kubectl apply -f \
#         https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/main/kubernetes/kubernetes.yml
#   - cert-manager (cert-manager.io) — REQUIRED here only because registerAdmin.certificate.source=generated
#     issues the admin client cert via cert-manager. The Messaging Topology Operator install
#     above also commonly relies on cert-manager for its own webhook. The ILM operator NEVER
#     installs cert-manager. (Drop registerAdmin for a no-cert-manager first run.)
#
#   Each dependency is DETECTED, not assumed: until an upstream operator is installed the
#   matching condition reports <X>NotInstalled and the platform WAITS (it never fails),
#   converging with no operator restart once the operator appears.
#
# NO SECRETS TO PRE-CREATE.
#   - The database password is generated by CloudNativePG (the operator reads back the
#     <cluster>-app Secret).
#   - The broker users' passwords are generated by the Messaging Topology Operator (the
#     operator reads back the per-user <user>-user-credentials Secrets).
#   - The Keycloak admin + the ilm OIDC client secret are generated by the Keycloak Operator
#     / Keycloak and relayed by the ILM operator into an operator-owned Secret it reads as
#     INTERNAL_OAUTH_SECRET — no operator-minted credential.
#   - The admin client cert is issued by cert-manager.
#   None of these values are ever inlined in the CR, status, conditions, events, or logs.
#
# DELETION: deletionPolicy defaults to Retain, so deleting this Platform LEAVES the managed
# CloudNativePG / RabbitMQ / Keycloak infrastructure and its data intact. Set it to Delete
# to also tear the managed infrastructure down.
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  common:
    # Canonical public FQDN. Managed Keycloak derives KC_HOSTNAME from it and the ilm OIDC
    # client's redirect/web-origin/post-logout URIs are built from it. Set it even with the
    # minimal/optional edge below (the platform must know its public address). edge.host
    # overrides it per-edge.
    hostName: ilm.example.com
  # ── managed PostgreSQL (CloudNativePG mints the app Secret) ──
  database:
    mode: managed
    managed:
      instances: 1
      version: "18"   # Postgres major version is a deliberate choice (data-format compatibility); latest supported by CloudNativePG
      storage:
        size: 20Gi
    # Connection pooling — REQUIRED for the managed fleet. Without it every component opens a direct
    # connection pool and Postgres's default 100 connections are exhausted (auth then 500s
    # and Core crash-loops). The operator provisions a CloudNativePG Pooler (PgBouncer, transaction
    # mode) and wires every component through it.
    pgBouncer:
      managed: true
  # ── managed RabbitMQ (Topology Operator mints the per-user Secrets) ──
  messaging:
    mode: managed
    brokerType: rabbitmq
    managed:
      replicas: 1
      # Pinned to the latest RabbitMQ the Cluster Operator supports. The operator's OWN matched
      # default is older (4.2.x), so this pin is required to run the latest; omit it to fall back
      # to the operator's matched server. (RabbitMQ 4.3 is Khepri-only — fine for a fresh cluster.)
      version: "4.3.1"
      storage:
        size: 10Gi
  # ── managed Keycloak (Keycloak Operator mints the admin Secret; the OIDC client secret
  #    is generated and relayed into INTERNAL_OAUTH_SECRET) ──
  keycloak:
    mode: managed
    realm: ilm
    managed:
      instances: 1
      # version omitted: the Keycloak Operator deploys its own matched server image (optimized
      # boot, no operator/server version skew). Pin spec.keycloak.managed.version only to force
      # a specific Keycloak server version.
  # ── first-admin bootstrap from a cert-manager-issued admin client cert (generated:
  #    nothing to pre-create; needs cert-manager) ──
  registerAdmin:
    enabled: true
    username: admin
    name: Platform Administrator
    lastName: Administrator
    email: admin@example.com
    certificate:
      enabled: true
      source: generated
  # ── edge is OPTIONAL: omit this whole block (or set enabled: false) to run behind your
  #    own ingress — common.hostName above still tells Keycloak/OIDC the public address.
  #    Enabled here for a turnkey internal-CA TLS edge. edge.host is OPTIONAL: when unset the
  #    edge uses common.hostName (set above); set it only to give this edge a different host. ──
  edge:
    enabled: true
    type: ingress
    className: nginx
    tls:
      source: internal               # operator-managed internal CA (needs cert-manager)
  # ── API gateway (Kong): trust the in-cluster ingress so Kong honours its X-Forwarded-* headers
  #    (https + the public host) and builds correct OAuth redirect URLs. REQUIRED behind the edge:
  #    without it Kong falls back to the internal http://…:8000 and the browser login redirect
  #    breaks. The operator default is empty (trust nothing); scope to your ingress's pod CIDR in
  #    production if you prefer not to trust all sources. ──
  gateway:
    trustedIps: ["0.0.0.0/0", "::/0"]
