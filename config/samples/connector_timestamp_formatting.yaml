# connector_timestamp_formatting.yaml — the timestamp-formatting connector.
#
# The image ships from the PRIVATE ILM repository, so the pull secret is mandatory:
#   kubectl create secret docker-registry registry-credentials -n ilm \
#     --docker-server=hub.omnitrustregistry.com --docker-username=<user> --docker-password=<token>
#
# This connector needs no secret of its own.
apiVersion: otilm.com/v1alpha1
kind: Connector
metadata:
  name: timestamp-formatting-connector
  namespace: ilm
  labels:
    app.kubernetes.io/part-of: ilm-platform
spec:
  image:
    repository: hub.omnitrustregistry.com/ilm-private/timestamp-formatting-connector
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecrets:
      - registry-credentials

  service:
    port: 8080
    type: ClusterIP

  env:
    - name: SERVER_PORT
      value: "8080"
    - name: LOGGING_LEVEL_COM_OTILM
      value: "INFO"

  probes:
    readiness:
      path: /v2/health/readiness
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    startup:
      path: /v2/health/liveness
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 10

  registration:
    name: "Timestamp Formatting"
    # The platform's BASE API URL, /api prefix INCLUDED — the operator appends only
    # /v2/connector/register. Without the /api this registration 404s.
    platformUrl: "http://core.ilm.svc.cluster.local:8080/api"
    authType: none
    customAttributes:
      - name: description
        content: "Timestamp formatting connector"
