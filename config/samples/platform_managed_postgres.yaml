# platform_managed_postgres.yaml — operator-provisioned PostgreSQL via CloudNativePG.
#
# A Platform whose database is MANAGED: instead of pointing at an external PostgreSQL,
# the operator renders a CloudNativePG Cluster and wires the platform to its generated
# read-write Service and application Secret. Messaging stays EXTERNAL here (set
# messaging.mode: managed and see platform_managed_rabbitmq.yaml to manage the broker too —
# the two can be combined).
#
# PREREQUISITES
#   - The ILM operator running in the cluster (make deploy / helm install).
#   - The CloudNativePG operator installed (it serves the postgresql.cnpg.io CRDs):
#       kubectl apply --server-side -f \
#         https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.29.1/cnpg-1.29.1.yaml
#     Until CloudNativePG is installed, the Platform reports DatabaseReady=False with
#     reason CloudNativePGNotInstalled and waits (it never fails) — install CloudNativePG
#     and it converges with no operator restart.
#   - cert-manager is NOT needed for this sample (no edge).
#
# SECRETS YOU MUST CREATE FIRST (same namespace as the Platform):
#   # Messaging credentials only — the DB credentials are GENERATED by CloudNativePG
#   # (the operator reads back the <cluster>-app Secret; you create nothing for the DB):
#   kubectl create secret generic ilm-messaging -n ilm \
#     --from-literal=username=ilm --from-literal=password=<broker-password>
#
# WHAT THE OPERATOR CREATES
#   - A CloudNativePG Cluster named "ilm-db" (3 instances here), with an "ilm"
#     application database + owner role. CloudNativePG generates the "ilm-db-app"
#     Secret (username/password); the operator wires Core/scheduler/auth to the
#     "ilm-db-rw" Service and that Secret. NONE of this is in the CR — no credentials,
#     no coordinates.
#
# DELETION (deletionPolicy)
#   - Retain (the default): deleting this Platform LEAVES the CloudNativePG Cluster and
#     its data intact (you reclaim it manually). This is the safe default.
#   - Delete: deleting the Platform also deletes the Cluster (CloudNativePG then garbage-
#     collects its PVCs). Set spec.deletionPolicy: Delete to opt in.
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  database:
    mode: managed
    managed:
      instances: 3
      version: "18"
      storage:
        size: 100Gi
        # storageClass: fast-ssd   # optional; omit to use the cluster default
      # resources:                 # optional per-instance requests/limits
      #   requests: { cpu: "2", memory: 4Gi }
      #   limits: { memory: 8Gi }
    # Connection pooler (PgBouncer): ON BY DEFAULT for a managed database (the operator
    # fronts it so the ILM fleet never exhausts max_connections). Omit the block to keep it.
    # To customize it, set managed: true explicitly and add settings (an empty block would
    # default managed=false and DISABLE the pooler):
    # pgBouncer:
    #   managed: true
    #   instances: 2
    # To turn it OFF entirely, see platform_managed_postgres_no_pooler.yaml (managed: false).
  messaging:
    mode: external
    brokerType: rabbitmq
    host: rabbitmq.example.com
    port: 5672
    virtualHost: ilm
    credentials:
      secretRef: ilm-messaging
