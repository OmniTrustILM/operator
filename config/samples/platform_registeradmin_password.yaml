# platform_registeradmin_password.yaml — first-admin bootstrap by the PASSWORD method
# (a Keycloak realm user), instead of the client-certificate method.
#
# With registerAdmin.password the operator creates an IDEMPOTENT Keycloak realm user in the
# platform realm via the Keycloak admin API, carrying the superadmin attribute
# (attributes.groups: ["superadmin"], which the operator's default realm surfaces as the
# "roles" claim Core grants superadmin on). The user's PASSWORD comes from a Secret YOU create
# (registerAdmin.password.secretRef) — the operator reads it read-only, hands it to Keycloak
# once, and NEVER mints, logs, or surfaces it (not in status, conditions, events, or any
# rendered object). The admin then signs in with username + password via OIDC. A new
# AdminUserReady condition reports the outcome.
#
# MANAGED-KEYCLOAK ONLY: the password method needs the Keycloak admin API, which exists only
# when the operator provisions Keycloak — so keycloak.mode MUST be "managed" (a CRD CEL rule
# rejects registerAdmin.password.enabled with any other keycloak.mode at admission).
#
# This sample disables the certificate method (certificate.enabled: false) to run password-only.
# See platform_registeradmin_generated.yaml / _provided.yaml for the certificate (mTLS) method,
# and platform_registeradmin_both.yaml for a generated client certificate AND a password user
# enabled together.
#
# PREREQUISITES
#   - The ILM operator running in the cluster.
#   - The Keycloak Operator installed (it serves the k8s.keycloak.org CRDs) — see
#     platform_managed_keycloak.yaml for the install manifests. Until it is present the
#     Platform reports KeycloakReady=False (reason KeycloakOperatorNotInstalled) and waits.
#   - External PostgreSQL + AMQP broker (this sample uses external infra; managed works too).
#     Managed Keycloak SHARES the platform database.
#
# SECRETS YOU MUST CREATE FIRST (same namespace as the Platform):
#   # DB + messaging creds (keys username/password), as in the minimal sample:
#   kubectl create secret generic ilm-db        -n ilm --from-literal=username=ilm --from-literal=password=<db-password>
#   kubectl create secret generic ilm-messaging -n ilm --from-literal=username=ilm --from-literal=password=<broker-password>
#   # The ADMIN PASSWORD — a generic Secret with key "password" (override with passwordKey).
#   # The operator reads this read-only to set the realm user's password; it is never minted
#   # by the operator and never logged:
#   kubectl create secret generic ilm-admin-password -n ilm --from-literal=password=<admin-password>
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  common:
    # Managed Keycloak derives KC_HOSTNAME from this, and the ilm OIDC client's redirect/
    # web-origin URIs are built from it — set it even without an operator-managed edge.
    hostName: ilm.example.com
  database:
    mode: external
    host: postgres.example.com
    port: 5432
    name: ilm
    credentials:
      secretRef: ilm-db
  messaging:
    mode: external
    brokerType: rabbitmq
    host: rabbitmq.example.com
    port: 5672
    virtualHost: ilm
    credentials:
      secretRef: ilm-messaging
  keycloak:
    mode: managed                 # REQUIRED for the password method (the admin-API user)
    realm: ilm
    managed:
      instances: 1
      # version omitted → the Keycloak Operator uses its matched default server image.
  registerAdmin:
    enabled: true
    # The identity below shapes the created realm user (username = login name, name =
    # display/first name, email = the user's email):
    username: admin
    name: Platform Administrator
    lastName: Administrator
    email: admin@example.com
    certificate:
      enabled: false              # password-only: turn OFF the client-certificate method
    password:
      enabled: true
      secretRef: ilm-admin-password   # the generic Secret you created above (key "password")
      # passwordKey: password         # OPTIONAL — the in-Secret key (defaults to "password")
