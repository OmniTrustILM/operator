# platform_managed_rabbitmq.yaml — operator-provisioned RabbitMQ via the RabbitMQ
# Cluster Operator + Messaging Topology Operator.
#
# A Platform whose messaging is MANAGED: instead of pointing at an external broker, the
# operator renders a RabbitmqCluster plus the full messaging topology (vhost, the four
# platform users, their permissions, the two exchanges, the seven queues, and the six
# bindings) and wires the platform to the broker Service and the Topology-generated
# per-user credentials Secrets. The database stays EXTERNAL here (see
# platform_managed_postgres.yaml for managed PostgreSQL; the two can be combined).
#
# PREREQUISITES
#   - The ILM operator running in the cluster (make deploy / helm install).
#   - The RabbitMQ Cluster Operator AND the Messaging Topology Operator installed (they
#     serve the rabbitmq.com CRDs):
#       kubectl apply -f \
#         https://github.com/rabbitmq/cluster-operator/releases/download/v2.21.0/cluster-operator.yml
#       kubectl apply -f \
#         https://github.com/rabbitmq/messaging-topology-operator/releases/download/v1.19.2/messaging-topology-operator-with-certmanager.yaml
#     Until the Cluster Operator is installed, the Platform reports MessagingReady=False
#     with reason RabbitMQNotInstalled; until the Topology Operator is installed, reason
#     TopologyOperatorNotInstalled. It waits (it never fails) — install the operators and
#     it converges with no operator restart.
#   - cert-manager is NOT needed for this sample (no edge). The Messaging Topology
#     Operator itself commonly requires cert-manager for its webhook — see its install docs.
#
# SECRETS YOU MUST CREATE FIRST (same namespace as the Platform):
#   # Database credentials only — the BROKER credentials are GENERATED by the Messaging
#   # Topology Operator (the operator reads back the per-user <user>-user-credentials
#   # Secrets; you create nothing for the broker):
#   kubectl create secret generic ilm-db -n ilm \
#     --from-literal=username=ilm --from-literal=password=<db-password>
#
# WHAT THE OPERATOR CREATES
#   - A RabbitmqCluster named "ilm-messaging" (1 replica here), plus the topology CRs for the
#     default 2.19.0 bundle: a Vhost ("/" by default; set messaging.virtualHost to change it),
#     five Users (administrator/provisioner/proxy/core/monitor), their five Permissions, the
#     ilm + ilm-proxy Exchanges, eleven Queues (core + the six core.* + provider.status-poll +
#     the three time-quality.*) and ten Bindings. Every VHOST-BOUND name is scoped by the
#     vhost — "ilm-messaging-default-vhost", "ilm-messaging-default-queue-core" and so on;
#     Users are cluster-global and stay unscoped. Pinning the legacy "czertainly" vhost (or any
#     vhost explicitly) renders the unscoped names instead. The Topology Operator generates one
#     "<user>-user-credentials" Secret per User; the operator wires Core/scheduler to the
#     "ilm-messaging" Service and the core-user Secret. NONE of this is in the CR — no
#     credentials, no coordinates.
#
# DELETION (deletionPolicy)
#   - Retain (the default): deleting this Platform LEAVES the RabbitmqCluster, its topology,
#     and its data intact (you reclaim it manually). This is the safe default.
#   - Delete: deleting the Platform also deletes the RabbitmqCluster + topology (the Cluster
#     Operator then garbage-collects its PVCs). Set spec.deletionPolicy: Delete to opt in.
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  database:
    mode: external
    host: postgres.example.com
    port: 5432
    name: ilm
    credentials:
      secretRef: ilm-db
  messaging:
    mode: managed
    brokerType: rabbitmq
    # virtualHost: "/"          # optional; omit to use the 2.19.0 bundle default "/"
    managed:
      replicas: 1
      # version omitted → the RabbitMQ Cluster Operator uses its matched default server image.
      storage:
        size: 20Gi
        # storageClass: fast-ssd   # optional; omit to use the cluster default
      # resources:                 # optional per-node requests/limits
      #   requests: { cpu: "1", memory: 2Gi }
      #   limits: { memory: 4Gi }
      # overrides: {}              # optional RFC-7396 JSON-merge patch onto the RabbitmqCluster spec
