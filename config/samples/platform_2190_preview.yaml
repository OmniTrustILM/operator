# platform_2190_preview.yaml — a Platform pinned to the ILM 2.19.0 PREVIEW bundle.
#
# 2.19.0 is a PREVIEW version bundle: its coordinates are recorded and rendered, but the
# operator does not ship it as the default yet. That has three consequences you must accept
# before applying this:
#   - OPT-IN ONLY. The bundle resolves solely because spec.version names it explicitly. It is
#     excluded from the operator's advertised supported versions, so nothing selects it by
#     accident.
#   - NOT THE DEFAULT. Omitting spec.version keeps you on the newest RELEASED bundle (2.18.0).
#   - NO UPGRADE PATH YET. A LIVE platform cannot be moved onto a preview: setting
#     spec.version: "2.19.0" on a running platform is refused with
#     Degraded/PreviewVersionUpgradeBlocked and the platform keeps running its current
#     version. Only a FRESH platform, pinned at creation like this one, comes up on 2.19.0.
# Use it to validate the 2.19.0 contract on a throwaway namespace, not to upgrade production.
#
# WHAT 2.19.0 CHANGES (the operator wires all of it — you configure no env-var names):
#   - images: core and frontend-administrator 2.19.0, auth 1.7.0, scheduler 1.1.1,
#   - the log-level env var is renamed LOGGING_LEVEL_COM_CZERTAINLY → LOGGING_LEVEL_COM_OTILM,
#   - the messaging exchanges are renamed (czertainly → ilm, czertainly-proxy → ilm-proxy), so
#     the per-instance queue Core registers at startup binds under ilm-proxy.
# Not yet wired: 2.19.0's time-quality integration, the time-quality-monitor sidecar and the
# platform instance-id env var are carried in the version data but no component renders them.
#
# PREREQUISITES
#   - The ILM operator running in the cluster (make deploy / helm install).
#   - An external PostgreSQL reachable at database.host:port with database.name.
#   - An external AMQP broker reachable at messaging.host:port (+ virtualHost).
#
# SECRETS YOU MUST CREATE FIRST (same namespace as the Platform):
#   # DB credentials — operator reads keys "username" and "password":
#   kubectl create secret generic ilm-db -n ilm \
#     --from-literal=username=ilm --from-literal=password=<db-password>
#   # Messaging credentials — operator reads keys "username" and "password":
#   kubectl create secret generic ilm-messaging -n ilm \
#     --from-literal=username=ilm --from-literal=password=<broker-password>
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  version: "2.19.0"                   # opt in to the preview bundle; fresh platforms only
  database:
    mode: external
    host: postgres.example.com
    port: 5432
    name: ilmdb
    credentials:
      secretRef: ilm-db
  messaging:
    mode: external
    brokerType: rabbitmq
    host: rabbitmq.example.com
    port: 5672
    virtualHost: ilm
    credentials:
      secretRef: ilm-messaging
