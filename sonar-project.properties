sonar.projectKey=OmniTrustILM_operator
sonar.organization=ilm

# Source and test configuration
sonar.sources=api,cmd,internal,pkg
sonar.tests=internal,pkg
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/zz_generated*.go,test/**

# Coverage
sonar.go.coverage.reportPaths=cover.out

# Lint report (golangci-lint checkstyle format)
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# Quality gate
sonar.qualitygate.wait=true

# Duplication
sonar.cpd.minimumTokens=100

# Ignore rules
# S1135 (resolve TODO comments) in the Helm->Platform converter: its doc comments describe the
# "# TODO" markers the tool intentionally EMITS into the generated CR (e.g. "create Secret" blocks).
# These document a feature, not outstanding tasks — exclude the rule for that one file.
sonar.issue.ignore.multicriteria=todoconv,todoconvtest
sonar.issue.ignore.multicriteria.todoconv.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.todoconv.resourceKey=pkg/convert/convert.go
sonar.issue.ignore.multicriteria.todoconvtest.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.todoconvtest.resourceKey=pkg/convert/convert_test.go
