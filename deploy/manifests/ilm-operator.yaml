                  with key mapping) or mounted as volumes — e.g. a private-PKI CA bundle for the
                  broker TLS connection. Values are projected by reference, never copied. The
                  operator-reserved env names (PROXY_CONFIG_TOKEN, PROXY_TOKEN_SIGNING_KEY) cannot
                  be remapped through a ref: the config-token wiring always wins.
                items:
                  description: SecretRef defines a reference to a Kubernetes secret.
                  properties:
                    keys:
                      description: Keys defines the individual key mappings from the
                        secret.
                      items:
                        description: RefKeyMapping defines the mapping of a key from
                          a secret or configmap.
                        properties:
                          envVar:
                            description: EnvVar is the environment variable name to
                              map to (for env type).
                            type: string
                          path:
                            description: Path is the file path to mount to (for volume
                              type).
                            type: string
                          secretKey:
                            description: SecretKey is the key in the secret to reference.
                            type: string
                        type: object
                      type: array
                    mountPath:
                      description: MountPath is the path to mount the secret (required
                        when type=volume).
                      type: string
                    name:
                      description: Name is the name of the secret.
                      type: string
                    type:
                      description: Type defines how the secret is consumed (env or
                        volume).
                      enum:
                      - env
                      - volume
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              securityContext:
                description: |-
                  SecurityContext tunes the per-workload runtime decisions of the container
                  security context (readOnlyRootFilesystem). The SCC-critical fields
                  (runAsNonRoot, no privilege escalation, dropped capabilities, seccomp) are
                  hardened by the shared builders and cannot be weakened from the CR.
                properties:
                  readOnlyRootFilesystem:
                    default: true
                    description: ReadOnlyRootFilesystem indicates that the container
                      has a read-only root filesystem.
                    type: boolean
                  runAsNonRoot:
                    default: true
                    description: RunAsNonRoot indicates that the container must run
                      as a non-root user.
                    type: boolean
                type: object
              serviceAccount:
                description: |-
                  ServiceAccount overrides the dedicated ServiceAccount's name (e.g. to bind a
                  pre-created workload-identity ServiceAccount) and stamps extra annotations on
                  it (e.g. an AWS IRSA role-arn or a GCP/Azure workload-identity binding).
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations are extra annotations stamped onto the rendered ServiceAccount (e.g.
                      a cloud workload-identity binding). They are non-sensitive routing metadata only.
                    type: object
                  name:
                    description: |-
                      Name overrides the ServiceAccount name the component uses (and is named after).
                      When unset the component's own name is used.
                    type: string
                type: object
              sidecars:
                description: |-
                  Sidecars are extra containers run alongside the main container (e.g. a vault
                  agent or log shipper). They are SCC-hardened like every other container. The
                  schema is preserved opaquely for the same CRD-size reason as InitContainers.
                x-kubernetes-preserve-unknown-fields: true
              terminationGracePeriodSeconds:
                description: |-
                  TerminationGracePeriodSeconds is the duration the pod needs to terminate
                  gracefully (in-flight broker messages drain before shutdown).
                format: int64
                type: integer
              tolerations:
                description: |-
                  Tolerations allow the proxy pods to schedule onto tainted nodes (e.g. dedicated
                  egress nodes).
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              volumes:
                description: Volumes defines additional emptyDir volumes mounted into
                  the proxy container.
                items:
                  description: VolumeSpec defines a volume to mount in the workload
                    pod.
                  properties:
                    emptyDir:
                      description: EmptyDir defines the emptyDir volume source.
                      properties:
                        medium:
                          description: Medium is the storage medium type (e.g., "",
                            "Memory").
                          type: string
                        sizeLimit:
                          description: SizeLimit is the maximum size of the emptyDir
                            volume.
                          type: string
                      type: object
                    mountPath:
                      description: MountPath is the path to mount the volume in the
                        container.
                      type: string
                    name:
                      description: Name is the name of the volume.
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
            required:
            - configTokenSecretRef
            type: object
          status:
            description: |-
              ProxyStatus defines the observed state of Proxy. Conditions and fields carry names,
              phases, reasons, and checksums — never secret values or connection coordinates.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the Proxy's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configChecksum:
                description: ConfigChecksum is a checksum of the referenced config-token
                  Secret.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              observedVersion:
                description: ObservedVersion is the resolved proxy image tag (BOM
                  default or spec.image override).
                type: string
              phase:
                description: Phase is the current phase of the Proxy.
                type: string
              readyReplicas:
                description: ReadyReplicas is the number of ready replicas.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
