  namespace: ilm
spec:
  hostnames:
  - ilm.example.com
  parentRefs:
  - name: platform-edge
  rules:
  - backendRefs:
    - name: api-gateway
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /
