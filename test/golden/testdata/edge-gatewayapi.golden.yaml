apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: core
    app.kubernetes.io/instance: ilm
    app.kubernetes.io/managed-by: ilm-operator
    app.kubernetes.io/name: core
    app.kubernetes.io/part-of: ilm
  name: core
  namespace: ilm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ilm
      app.kubernetes.io/name: core
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        otilm.com/platform-version: 2.18.0
      labels:
        app.kubernetes.io/component: core
        app.kubernetes.io/instance: ilm
        app.kubernetes.io/managed-by: ilm-operator
        app.kubernetes.io/name: core
        app.kubernetes.io/part-of: ilm
    spec:
      containers:
      - args:
        - run
        - --server
        - --addr=0.0.0.0:8181
        - --set=services.nginx.url=http://auth-opa-policies:8080
        - --set=bundles.nginx.service=nginx
        - --set=bundles.nginx.resource=bundles/bundle.tar.gz
        image: hub.omnitrustregistry.com/ilm/opa:1.10.0-static
        imagePullPolicy: IfNotPresent
        name: auth-opa
        ports:
        - containerPort: 8181
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health?bundle=true
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 3
          httpGet:
            path: /health?bundle=true
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
      - env:
        - name: HEADER_ENABLED
          value: "true"
        - name: HEADER_NAME
          value: ssl-client-cert
        - name: JDBC_URL
          value: jdbc:postgresql://db.example.com:5432/ilm?characterEncoding=UTF-8
        - name: BROKER_VIRTUAL_HOST
          value: ilm
        - name: OPA_BASE_URL
          value: http://localhost:8181
        - name: AUTH_SERVICE_BASE_URL
          value: http://auth:8080
        - name: SCHEDULER_BASE_URL
          value: http://scheduler:8080
        - name: LOGGING_LEVEL_COM_CZERTAINLY
          value: INFO
        - name: PROVISIONING_API_URL
          value: https://prov.example.com
        - name: PROXY_ENABLED
          value: "false"
        - name: JDBC_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: core-secret
        - name: JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: core-secret
        - name: BROKER_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: messaging-secret
        - name: BROKER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: messaging-secret
        - name: TRUSTED_CERTIFICATES
          valueFrom:
            secretKeyRef:
              key: ca.crt
              name: trusted-certificates
              optional: true
        - name: PROVISIONING_API_KEY
          valueFrom:
            secretKeyRef:
              key: provisioningApiKey
              name: provisioning-secret
        - name: ADMIN_CERT
          valueFrom:
            secretKeyRef:
              key: tls.crt
              name: admin-certificate-secret
              optional: true
        - name: BROKER_HOST
          valueFrom:
            configMapKeyRef:
              key: messaging.host
              name: messaging-configmap
        - name: BROKER_PORT
          valueFrom:
            configMapKeyRef:
              key: messaging.amqp.port
              name: messaging-configmap
        image: hub.omnitrustregistry.com/ilm/core:2.18.0
        imagePullPolicy: IfNotPresent
        lifecycle:
          postStart:
            exec:
              command:
              - sh
              - -c
              - /opt/ilm/scripts/register-admin.sh
        name: core
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /api/v1/health/readiness
            port: 8080
          initialDelaySeconds: 15
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 45
          httpGet:
            path: /api/v1/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - mountPath: /tmp
          name: ephemeral
        - mountPath: /opt/ilm/scripts
          name: core-scripts
          readOnly: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |
          while ! nc -z auth 8080; do sleep 1; done &&
          while ! nc -z auth-opa-policies 8080; do sleep 1; done &&
          echo "auth service seems to be started" &&
          while ! nc -z "$MQ_WAIT_HOST" "$MQ_WAIT_PORT"; do sleep 1; done &&
          while ! nc -z scheduler 8080; do sleep 1; done &&
          echo "messaging and scheduler service seems to be started"
        env:
        - name: MQ_WAIT_HOST
          value: messaging-service
        - name: MQ_WAIT_PORT
          value: "5672"
        image: hub.omnitrustregistry.com/ilm/curl:8.16.0
        imagePullPolicy: IfNotPresent
        name: wait-for-auth
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: core
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 1Mi
        name: ephemeral
      - configMap:
          defaultMode: 493
          items:
          - key: register-admin.sh
            path: register-admin.sh
          name: ilm-core-scripts
        name: core-scripts
---
