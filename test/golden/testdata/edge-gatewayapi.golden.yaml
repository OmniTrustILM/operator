    app.kubernetes.io/component: platform-edge
    app.kubernetes.io/instance: ilm
    app.kubernetes.io/managed-by: ilm-operator
    app.kubernetes.io/name: platform-edge
    app.kubernetes.io/part-of: ilm
  name: platform-edge
  namespace: ilm
spec:
  gatewayClassName: istio
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: ilm.example.com
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: ilm.example.com
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - kind: Secret
        name: ilm-ingress-tls
      mode: Terminate
---
apiVersion: gateway.networking.k8s.io/v1
