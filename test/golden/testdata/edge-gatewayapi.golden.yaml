---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/instance: ilm
    app.kubernetes.io/managed-by: ilm-operator
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ilm
  name: api-gateway
  namespace: ilm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ilm
      app.kubernetes.io/name: api-gateway
  strategy: {}
  template:
    metadata:
      annotations:
        otilm.com/platform-version: 2.18.0
      labels:
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/instance: ilm
        app.kubernetes.io/managed-by: ilm-operator
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: ilm
    spec:
      containers:
      - env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_PREFIX
          value: /tmp/
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_LISTEN
          value: 0.0.0.0:8001, 0.0.0.0:8444 ssl
        - name: KONG_STATUS_LISTEN
          value: 0.0.0.0:8100
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/declarative/kong.yml
        - name: KONG_PLUGINS
          value: request-transformer,cors,file-log,response-transformer,post-function
        - name: KONG_LOG_LEVEL
          value: info
        image: hub.omnitrustregistry.com/ilm/kong:3.9.1
        imagePullPolicy: IfNotPresent
        name: api-gateway
        ports:
        - containerPort: 8000
          name: consumer-http
        - containerPort: 8001
          name: admin-http
        readinessProbe:
          exec:
            command:
            - kong
            - health
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          exec:
            command:
            - kong
            - health
          failureThreshold: 45
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /kong/declarative
          name: api-gateway-config-volume
        - mountPath: /tmp
          name: ephemeral
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: api-gateway
      volumes:
      - configMap:
          items:
          - key: kong.yml
            path: kong.yml
          name: global-configmap
        name: api-gateway-config-volume
      - emptyDir:
          medium: Memory
          sizeLimit: 10Mi
        name: ephemeral
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: auth
    app.kubernetes.io/instance: ilm
    app.kubernetes.io/managed-by: ilm-operator
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: ilm
  name: auth
  namespace: ilm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ilm
      app.kubernetes.io/name: auth
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        otilm.com/platform-version: 2.18.0
      labels:
        app.kubernetes.io/component: auth
        app.kubernetes.io/instance: ilm
        app.kubernetes.io/managed-by: ilm-operator
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: ilm
    spec:
      containers:
      - env:
        - name: TMPDIR
          value: /tmp
        - name: AUTH_CREATE_UNKNOWN_USERS
          value: "false"
        - name: AUTH_CREATE_UNKNOWN_ROLES
          value: "false"
        - name: SYNC_POLICY
          value: create-only
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: AUTH_DB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              key: connection-string
              name: auth-db
        image: hub.omnitrustregistry.com/ilm/auth:1.6.3
        imagePullPolicy: IfNotPresent
        name: auth
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 45
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /tmp
          name: ephemeral
        - mountPath: /etc/ssl/certs
          name: trusted-certificates-volume
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: auth
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 1Mi
        name: ephemeral
      - name: trusted-certificates-volume
        secret:
          defaultMode: 420
          secretName: trusted-certificates
---
